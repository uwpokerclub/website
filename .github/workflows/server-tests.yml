name: Server Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Install dependencies
        run: |
          go mod download
          # Required at run time: the suite provisions its own databases with
          # testcontainers, which shells out to this binary to apply migrations.
          ATLAS_VERSION=v1.1.0 curl -sSf https://atlasgo.sh | sh
      - name: Run tests
        run: go test -p=1 ./internal/...
